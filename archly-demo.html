<!--
================================================================================
 Archly クライアント向けデモページ（見た目のみ・DB/API接続なし・完全オフライン）

 視点：発注する側（クライアント）のアカウントでログイン済みの状態
       = isAdmin false。実装の管理者ゲートは全てOFFで描画している。
================================================================================

 ■ 実コードから抽出した値（推測ではなく下記ファイルから読み取り）

 [1] src/app/globals.css
     --background            : #f8fafb
     --foreground            : #1a1a2e
     --color-brand-primary   : #1e3a5f
     --color-brand-accent    : #4ecdc4
     --color-brand-accent-hover : #3dbdb4
     body { font-family: Arial, Helvetica, sans-serif }
       ※ root layout は next/font の Geist を CSS変数として読み込むが、
         globals.css の body ルールが font-family を直接上書きするため
         実際の描画は Arial/Helvetica系。デモも同じスタックにしている。

 [2] コード内に直書きされているブランド色（tailwind.config は存在しない = Tailwind v4）
     ネイビー(primary)        : #1E3A5F   hover: #2A4F7A
     ティール(accent)         : #4ECDC4
     ティール文字/リンク      : #3DBDB4   hover: #2FA8A0
     ティール淡色背景         : #E8F8F7   （タスク追加フォーム / D&D中）
     アプリ背景               : #F8FAFB
     サイドバー背景           : #1E3A5F   境界線: #0F2340
     サイドバー active        : bg-[#4ECDC4]/20 + text-[#4ECDC4]

 [3] ステータス5段階＋自動判定値（src/lib/project-status.ts）
     ProjectStatus = '依頼済' | '確認中' | '作成中' | '確認待ち' | '完了' | '対応中'
     PROJECT_STATUS_COLORS = {
       依頼済  : bg-gray-100   text-gray-700
       確認中  : bg-blue-100   text-blue-700
       作成中  : bg-amber-100  text-amber-700
       確認待ち: bg-purple-100 text-purple-700
       完了    : bg-green-100  text-green-700
       対応中  : bg-sky-100    text-sky-700
     }
     ※ タスク選択肢は5段階（src/components/project/tasks-tab.tsx の STATUSES）。
       '対応中' は案件ステータスの自動導出でのみ現れる値。

 [4] 案件ステータスの自動導出（computeProjectStatus）
     ・タスク0件            → '依頼済'
     ・全タスクが同一ステータス → そのステータスをそのまま案件ステータスにする
     ・混在                 → '対応中'
     案件詳細のバッジには title="依頼のステータスから自動判定" が付く。
     デモもこの関数をそのまま移植（後述 computeProjectStatus）。

 [5] 提出期限の色分け（src/lib/deadline.ts）
     deadlineDiffDays: 双方 00:00:00 に丸めて floor((期限 - 今日)/1日)
     deadlineLevel   : diff <= 1 → 'urgent' / diff <= 3 → 'soon' / それ以外 'none'
     deadlineColorClass: urgent → text-red-600 / soon → text-yellow-600 / none → text-gray-500
     ※ 期限切れ（diff が負）も 'urgent'（赤）。完了案件でも期限が過去なら赤になる。
     表示形式: new Date(deadline).toLocaleDateString('ja-JP') → 例 2026/8/10

 [6] クライアント（isAdmin = false）で消える／変わるUI ← 今回の視点
     実装の管理者ゲートは以下の6箇所。本デモは全てクライアント側の表示にしている。
       a. layout/sidebar.tsx:113        → 「ユーザー管理」リンクを出さない
       b. app/(dashboard)/page.tsx:177  → clientOptions を取得しない
          + create-project-button.tsx:81 → 新規案件作成モーダルの「依頼元」select を出さない
       c. project/project-header.tsx:231 → 案件詳細の「編集」「削除」を出さない
       d. project/tasks-tab.tsx:170      → 依頼の「削除」は canDelete = created_by === 自分 のときだけ
                                           （制作側が追加した依頼には削除ボタンが出ない）
       e. archive/page.tsx:63,89         → アーカイブ表の「操作」列そのものが無くなる
       f. admin/users/page.tsx           → notFound()。クライアントは画面自体に到達できない
     一方で以下は権限に関係なく全員が操作できる（実装どおりデモにも残している）：
       ・「新規案件作成」ボタン
       ・依頼タブの「＋ 依頼を追加」と、各依頼のステータス変更 select
       ・ファイルの追加／フォルダの追加／ドラッグ&ドロップ
       ・チャットの送信

 [7] Tailwind v4 デフォルト色 → 実HEX（バッジ・文字色に使用）
     gray-50 #F9FAFB / gray-100 #F3F4F6 / gray-200 #E5E7EB / gray-300 #D1D5DC
     gray-400 #99A1AF / gray-500 #6A7282 / gray-600 #4A5565 / gray-700 #364153 / gray-900 #101828
     blue-100 #DBEAFE / blue-700 #1447E6 / blue-200 #BEDBFF
     amber-100 #FEF3C6 / amber-700 #BB4D00
     purple-100 #F3E8FF / purple-700 #8200DB
     green-100 #DCFCE7 / green-700 #008236
     sky-100 #DFF2FE / sky-700 #0069A8
     red-600 #E7000B / red-500 #FB2C36 / red-50 #FEF2F2 / red-300 #FFA2A2
     yellow-600 #D08700

 [8] ダッシュボード（src/app/(dashboard)/page.tsx）
     見出し「ダッシュボード」/ 補足「参加中の案件一覧」/ ボタン「新規案件作成」
     カード: rounded-lg border-gray-200 bg-white p-6 shadow-md（hover:shadow-lg）
     グリッド: grid-cols-1 / sm:2 / lg:3、gap-4
     行: バッジ → 案件名(text-lg font-semibold) → 「依頼元: {display_name}」
         → 「作成日: {ja-JP日付}」 → 「提出期限: {ja-JP日付}」(色分け)
         → 「依頼進捗」「{done}/{total} 完了」+ 進捗バー h-1.5 bg-[#4ECDC4] / bg-gray-200
     並び順: created_at 降順、archived_at IS NULL のみ
     空表示: 「案件はありません」
     ※ 「依頼元」は client_id の表示名。クライアント本人が依頼元なので全件で自分の名前になる
       （実装どおり。制作側が代理登録した案件も client_id は依頼元＝自分になる）

 [9] レイアウト（layout/shell-client.tsx, layout/sidebar.tsx）
     モバイルヘッダー: h-14、ハンバーガー(aria-label="メニューを開く")＋「Archly」、md未満のみ
     サイドバー: w-64 / h-16ヘッダー（archly-icon.svg 24px ＋ 「Archly」text-xl font-bold）
     ナビ: ダッシュボード / アーカイブ / 設定（＋管理者のみユーザー管理）、最下部「ログアウト」
     main: bg-[#F8FAFB] p-4 md:p-8、ルートは h-[100dvh] flex-col md:flex-row
     ブレークポイント md = 768px（Tailwind 既定）

 [10] 案件詳細（projects/[id]/page.tsx, project/project-header.tsx, project/project-tabs.tsx）
     戻る導線: 「← ダッシュボードに戻る」text-sm text-[#3DBDB4]（実装は &larr;）
     ヘッダーカード: 案件名(text-2xl font-bold) / 「依頼元: {name}」 / 右にステータスバッジ
                     「依頼内容」見出し＋本文(whitespace-pre-wrap)
                     dl 3列: 「作成日」「最終更新」「提出期限」（提出期限のみ色分け・未設定は「未設定」）
     タブ順: 依頼 / チャット / ファイル（active: border-b-2 border-[#4ECDC4] + text-[#3DBDB4]）

 [11] 依頼タブ（project/tasks-tab.tsx）
     見出し「依頼一覧」、ボタン「＋ 依頼を追加」⇔「閉じる」
     タスクカード: バッジ → タイトル(完了は line-through + text-gray-400)
                   → 詳細 → 「期限: {日付}」(色分け・完了は打消し) 「作成: {name}」
                   右: 5段階の select ＋（自分が作成した依頼のみ）「削除」
     空表示: 「依頼はまだありません」

 [12] ファイルタブ（project/files-tab.tsx）
     見出し「ファイル一覧」、ボタン「ファイルを追加」「フォルダを追加」
     D&D領域: 「ここにファイルまたはフォルダをドラッグ&ドロップ」
     フォルダ行: 📂/📁 ＋ 名前 ＋ (子要素数)
     ファイル行: 📄 ＋ ファイル名(text-[#3DBDB4]) / 下段「{アップロード者} ・ {日付} ・ {サイズ}」
                 右に「ダウンロード」ボタン
     formatFileSize: <1024 → "N B" / <1MiB → "X.X KB" / それ以上 → "X.X MB"
       ※ アイコンは lucide ではなく絵文字（📄📂📁）。実装の見た目をそのまま踏襲した。
     空表示: 「まだファイルはありません」

 [13] チャットタブ（project/chat-tab.tsx）
     高さ h-[70vh] md:h-96
     自分の発言: 右寄せ bg-[#1E3A5F] text-white、名前 text-white/70、時刻 text-blue-200
     相手の発言: 左寄せ bg-gray-100 text-gray-900、名前 text-gray-500、時刻 text-gray-400
     吹き出し幅: max-w-[80%] md:max-w-xs lg:max-w-md
     時刻表示: toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
     入力欄 placeholder「メッセージを入力...」／ボタン「送信」
     空表示: 「まだメッセージはありません」

 [14] 新規案件作成モーダル（components/create-project-button.tsx）
     タイトル「新規案件作成」
     項目: 案件名*（placeholder「案件名を入力」）
           ── 依頼元 select は管理者のみのため、クライアント視点では出ない ──
           依頼内容（placeholder「依頼内容を入力（任意）」rows=4）
           提出期限（type=date）
           依頼書類名（補足「作成してほしい書類名を入力してください（任意、後から追加可能）」／
                      placeholder「例：届出一覧」／「＋ 依頼ファイルを追加」／削除は ✕）
     ボタン: 「キャンセル」「作成」（送信中は「作成中...」）
     作成時の初期値: projects.status='依頼済'、タスクも '依頼済' で作成される

 [15] アーカイブ（archive/page.tsx）
     見出し「アーカイブ」／補足「「完了」から15日経過した案件は自動的にアーカイブされます。」
     テーブル列: 案件名 / ステータス / アーカイブ日（「操作」列は管理者のみ）
     ※ このページのバッジ配色は他画面と異なる独自定義（実装のまま再現）
        依頼済 orange-100/orange-800、確認中 yellow-100/yellow-800、作成中 blue-100/#2FA8A0、
        確認待ち purple-100/purple-800、完了 green-100/green-800
     空表示: 「アーカイブ済みの案件はありません。」

 [16] 設定（settings/page.tsx）… 権限に関係なく全員が見られる
     「設定」「プロフィール・パスワード・通知を変更できます。」
     セクション プロフィール / パスワード変更 / プッシュ通知（文言はコード通り）

// src/lib/project-status.ts の computeProjectStatus をそのまま移植
function computeProjectStatus(taskStatuses) {
  if (taskStatuses.length === 0) return '依頼済';
  const unique = new Set(taskStatuses);
  if (unique.size === 1) return taskStatuses[0];
  return '対応中';
}

// src/lib/deadline.ts の移植
function deadlineDiffDays(deadline) {
  if (!deadline) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const target = new Date(deadline); target.setHours(0, 0, 0, 0);
  return Math.floor((target.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
}
function deadlineLevel(deadline) {
  const diff = deadlineDiffDays(deadline);
  if (diff === null) return 'none';
  if (diff <= 1) return 'urgent';
  if (diff <= 3) return 'soon';
  return 'none';
}
function deadlineColorClass(level) {
  if (level === 'urgent') return 'dl-urgent';
  if (level === 'soon') return 'dl-soon';
  return 'dl-none';
}
function formatDeadline(d) { return d ? new Date(d).toLocaleDateString('ja-JP') : ''; }

// src/components/project/files-tab.tsx の formatFileSize をそのまま移植
function formatFileSize(bytes) {
  if (bytes === null || bytes === undefined) return '-';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/* ============================================================================
   3. ユーティリティ
   ========================================================================== */
function h(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function offsetToDate(offset, time) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offset);
  if (time) {
    const [hh, mm] = time.split(':');
    d.setHours(Number(hh), Number(mm), 0, 0);
  }
  return d;
}
function jpDate(d) { return d.toLocaleDateString('ja-JP'); }
function jpTime(d) { return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }); }

function renderFilesTab(p) {
  // relative_path からフォルダツリーを構築（files-tab.tsx の buildTree 相当）
  const rootFiles = [];
  const folders = new Map();
  for (const f of p.files) {
    if (!f.path || f.path.indexOf('/') === -1) { rootFiles.push(f); continue; }
    const dir = f.path.split('/').slice(0, -1).join('/');
    if (!folders.has(dir)) folders.set(dir, []);
    folders.get(dir).push(f);
  }
  const fileRow = (f, depth) => `
    <div class="file-row${depth > 0 ? ' child-of-folder' : ''}" style="padding-left:${12 + depth * 16}px">
      <div class="file-main">
        <span class="file-name"><span aria-hidden="true">📄</span><span class="t">${h(f.name)}</span></span>
        <p class="file-sub">${h(f.by)} ・ ${h(jpDate(offsetToDate(f.atOffset)))} ・ ${h(formatFileSize(f.size))}</p>
      </div>
      <button class="btn-xs" data-act="noop" style="margin-left:12px">ダウンロード</button>
    </div>`;

  const folderBlocks = Array.from(folders.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, fs]) => `
      <div>
        <button class="folder-btn" data-act="noop"><span aria-hidden="true">📂</span><span>${h(name)}</span><span class="count">(${fs.length})</span></button>
        ${fs.slice().sort((a, b) => a.name.localeCompare(b.name)).map(f => fileRow(f, 1)).join('')}
      </div>`).join('');

  return `
    <div class="row-between" style="margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <h4 class="section-label" style="color:var(--gray-700)">ファイル一覧</h4>
      <div style="display:flex;gap:8px">
        <button class="btn-primary md" data-act="noop">ファイルを追加</button>
        <button class="btn-outline-navy" data-act="noop">フォルダを追加</button>
      </div>
    </div>
    <div class="dropzone">ここにファイルまたはフォルダをドラッグ&amp;ドロップ</div>
    ${p.files.length === 0 ? '<p class="empty">まだファイルはありません</p>' : `
      <div class="file-list">
        ${folderBlocks}
        ${rootFiles.slice().sort((a, b) => a.name.localeCompare(b.name)).map(f => fileRow(f, 0)).join('')}
      </div>`}
  `;
}

function renderMessages(p) {
  let out = '';
  let lastDay = null;
  const lastOwnIdx = (() => {
    for (let i = p.messages.length - 1; i >= 0; i--) if (p.messages[i].self) return i;
    return -1;
  })();

  p.messages.forEach((m, i) => {
    const d = offsetToDate(m.day, m.time);
    const dayKey = jpDate(d);
    if (dayKey !== lastDay) {
      // TODO: 要確認 — 実装は時刻のみ表示。日付区切りはデモの可読性のため追加
      out += `<div class="day-sep">${h(dayKey)}</div>`;
      lastDay = dayKey;
    }
    out += `
      <div class="msg${m.self ? ' own' : ''}">
        <div class="bubble">
          <p class="who">${h(m.name)}</p>
          <p class="body">${h(m.text)}</p>
          <p class="at">${h(jpTime(d))}</p>
        </div>
      </div>`;
    // TODO: 要確認 — 「既読」表示は実アプリに存在しない（messages に read_at 等なし）。デモ用に追加
    if (i === lastOwnIdx && !p.unread) {
      out += `<div class="read-mark">既読</div>`;
    }
  });
  return out;
}

/* ---- チャット一覧（TODO: 要確認 = 実アプリに存在しない画面） ---- */
function renderChats() {
  const items = PROJECTS.slice()
    .map(p => ({ p, last: lastMessage(p) }))
    .filter(x => x.last)
    .sort((a, b) => offsetToDate(b.last.day, b.last.time) - offsetToDate(a.last.day, a.last.time))
    .map(({ p, last }) => {
      const d = offsetToDate(last.day, last.time);
      const isToday = last.day === 0;
      return `
      <button class="thread" data-chat="${h(p.id)}">
        <div class="thread-main">
          <div class="thread-title">${h(p.name)}</div>
          <div class="thread-preview">${last.self ? '自分: ' : ''}${h(last.text)}</div>
        </div>
        <div class="thread-side">
          <span class="thread-time">${h(isToday ? jpTime(d) : jpDate(d))}</span>
          ${p.unread ? `<span class="unread-badge">${p.unread}</span>` : ''}
        </div>
      </button>`;
    }).join('');

  return `
    <h2 class="page-title">チャット</h2>
    <p class="page-sub">案件ごとのスレッド</p>
    <!-- TODO: 要確認 — この一覧画面と未読バッジは実アプリに存在しない（チャットは案件詳細のタブのみ） -->
    <div class="thread-list">${items}</div>
  `;
}

/* ---- アーカイブ ---- */
function renderArchive() {
  return `
    <h2 class="page-title">アーカイブ</h2>
    <p class="page-sub">「完了」から15日経過した案件は自動的にアーカイブされます。</p>
    <div class="mt-8 panel" style="overflow:hidden">
      <table class="tbl">
        <!-- 「操作」列は archive/page.tsx:63,89 の isAdmin ゲート内。クライアントには出ない -->
        <thead><tr><th>案件名</th><th>ステータス</th><th>アーカイブ日</th></tr></thead>
        <tbody>
          ${ARCHIVED.map(a => `
          <tr>
            <td><span style="font-weight:500;color:var(--accent-text)">${h(a.name)}</span></td>
            <td><span class="badge ar-${h(a.status)}">${h(a.status)}</span></td>
            <td style="color:var(--gray-600)">${h(jpDate(offsetToDate(a.archivedOffset)))}</td>
          </tr>`).join('')}

}

/* ---- 設定 ---- */
function renderSettings() {
  return `
    <div class="max-2xl">
      <h2 class="page-title">設定</h2>
      <p class="page-sub">プロフィール・パスワード・通知を変更できます。</p>

      <section class="panel panel-pad mt-6">
        <h3 style="font-size:18px;line-height:28px;font-weight:600;color:var(--gray-900)">プロフィール</h3>
        <p class="hint" style="margin-top:4px">案件やチャットで表示される名前を変更できます。</p>
        <div class="mt-4 field">
          <label>表示名</label>
          <input class="inp" value="${h(CURRENT_USER.name)}">
        </div>
        <button class="btn-primary md" data-act="noop">保存</button>
      </section>

      <section class="panel panel-pad mt-6">
        <h3 style="font-size:18px;line-height:28px;font-weight:600;color:var(--gray-900)">パスワード変更</h3>
        <p class="hint" style="margin-top:4px">現在のパスワードを確認してから、新しいパスワードに更新します。</p>
        <div class="mt-4 field"><label>現在のパスワード</label><input class="inp" type="password"></div>
        <div class="field"><label>新しいパスワード</label><input class="inp" type="password"></div>
        <button class="btn-primary md" data-act="noop">変更する</button>

      <section class="panel panel-pad mt-6">
        <h3 style="font-size:18px;line-height:28px;font-weight:600;color:var(--gray-900)">プッシュ通知</h3>
        <p class="hint" style="margin-top:4px">ブラウザの通知許可が必要です。拒否している場合はブラウザ設定から許可してください。</p>
        <div class="mt-4" style="display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--gray-700)">
          <label><input type="checkbox" checked> 通知を有効にする</label>
          <label><input type="checkbox" checked> チャット</label>
          <label><input type="checkbox" checked> 新規案件</label>
          <label><input type="checkbox" checked> ステータス変更</label>
          <label><input type="checkbox" checked> 提出期限</label>
        </div>
      </section>
    </div>`;
}

/* ---- 新規案件作成モーダル ---- */
function renderModal() {
  return `
  <div class="overlay" data-overlay>
    <div class="modal">
      <h3>新規案件作成</h3>
      <form class="mt-4" data-form="create-project">
        <div class="field">
          <label>案件名 <span class="req">*</span></label>
          <input class="inp" name="name" required placeholder="案件名を入力" value="${h(state.newProject.name)}">
        </div>
        <!-- 「依頼元」select は create-project-button.tsx:81 の isAdmin ゲート内。クライアントには出ない -->
        <div class="field">
          <label>依頼内容</label>
          <textarea class="inp" name="description" rows="4" placeholder="依頼内容を入力（任意）">${h(state.newProject.description)}</textarea>
        </div>
        <div class="field">
          <label>提出期限</label>
          <input class="inp" type="date" name="deadline" value="${h(state.newProject.deadline)}">
        </div>
        <div class="field">
          <label>依頼書類名</label>
          <p class="hint">作成してほしい書類名を入力してください（任意、後から追加可能）</p>
          <div style="margin-top:8px">
            ${state.newTaskRows.map((v, i) => `
              <div class="task-input-row">
                <input class="inp" name="tasks" value="${h(v)}" placeholder="例：届出一覧" data-taskrow="${i}">
                <button type="button" class="x-btn" aria-label="削除" data-remove-row="${i}">✕</button>
              </div>`).join('')}
            <button type="button" class="add-file-link" data-act="add-row">＋ 依頼ファイルを追加</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" data-act="close-modal">キャンセル</button>
          <button type="submit" class="btn-primary md">作成</button>
        </div>
      </form>
    </div>
  </div>`;
}

/* ---- 全体描画 ---- */
let lastViewKey = null;
function render() {
  // 画面が変わらない再描画（タブ切替・送信など）ではスクロール位置を保つ
  const prevMain = document.querySelector('.main');
  const prevScroll = prevMain ? prevMain.scrollTop : 0;
  const viewKey = state.view + ':' + (state.projectId || '');

  let body = '';
  if (state.view === 'dashboard') body = renderDashboard();
  else if (state.view === 'project') body = renderProject();
  else if (state.view === 'chats') body = renderChats();
  else if (state.view === 'archive') body = renderArchive();
  else if (state.view === 'settings') body = renderSettings();

  document.getElementById('app').innerHTML = `
    <div class="shell">
      <header class="mobile-header">
        <button class="burger" aria-label="メニューを開く" data-act="open-drawer">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
          </svg>
        </button>
        <h1>Archly</h1>
        <div class="header-spacer"></div>
      </header>

      <div class="sidebar-desktop">${renderSidebar()}</div>

      ${state.drawer ? `
      <div class="drawer">
        <div class="drawer-scrim" data-act="close-drawer"></div>
        <div class="drawer-panel">${renderSidebar()}</div>
      </div>` : ''}

      <main class="main">${body}</main>
    </div>
    ${state.modal ? renderModal() : ''}
  `;

  const main = document.querySelector('.main');
  if (main) main.scrollTop = viewKey === lastViewKey ? prevScroll : 0;
  lastViewKey = viewKey;

  const sc = document.getElementById('chat-scroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

/* ============================================================================
   6. イベント
   ========================================================================== */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-nav],[data-act],[data-project],[data-tab],[data-filter],[data-chat],[data-remove-row],[data-task-del]');
  if (!t) return;

  if (t.dataset.nav) {
    state.view = t.dataset.nav;
    state.drawer = false;
    if (t.dataset.nav !== 'project') { state.projectId = null; state.chatFrom = null; }
    return render();
  }
  if (t.dataset.project && t.classList.contains('project-card')) {
    state.view = 'project'; state.projectId = t.dataset.project; state.tab = 'tasks';
    state.taskFormOpen = false; state.chatFrom = null;
    return render();
  }
  if (t.dataset.chat) {
    const p = projectById(t.dataset.chat);
    if (p) p.unread = 0;
    state.view = 'project'; state.projectId = t.dataset.chat; state.tab = 'chat';
    state.chatFrom = 'chats';
    return render();
  }
  if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    if (state.tab === 'chat') { const p = projectById(state.projectId); if (p) p.unread = 0; }
    return render();
  }
  if (t.dataset.filter) { state.filter = t.dataset.filter; return render(); }
  if (t.dataset.removeRow !== undefined) {
    const i = Number(t.dataset.removeRow);
    syncModalFields();
    state.newTaskRows = state.newTaskRows.length === 1 ? [''] : state.newTaskRows.filter((_, idx) => idx !== i);
    return render();
  }
  if (t.dataset.taskDel) {
    const [pid, idx] = t.dataset.taskDel.split(':');
    const p = projectById(pid);
    if (p && confirm('この依頼を削除しますか？')) { p.tasks.splice(Number(idx), 1); render(); }
    return;
  }

  switch (t.dataset.act) {
    case 'open-drawer':  state.drawer = true; return render();
    case 'close-drawer': state.drawer = false; return render();
    case 'open-modal':
      state.modal = true;
      state.newTaskRows = [''];
      state.newProject = { name: '', description: '', deadline: '' };
      return render();
    case 'close-modal':  state.modal = false; return render();
    case 'add-row':      syncModalFields(); state.newTaskRows.push(''); return render();
    case 'toggle-task-form': state.taskFormOpen = !state.taskFormOpen; return render();
    case 'send':         return sendMessage(t.dataset.project);
    case 'signout':      alert('デモのためログアウトはしません。'); return;
    case 'noop':         return;
  }
});

// モーダル背景クリックで閉じる
document.addEventListener('click', (e) => {
  if (e.target.hasAttribute && e.target.hasAttribute('data-overlay')) { state.modal = false; render(); }
});

// 行の増減で再描画する際、入力済みの値を失わないように state に退避する
function syncModalFields() {
  const inputs = document.querySelectorAll('[data-taskrow]');
  if (inputs.length) state.newTaskRows = Array.from(inputs).map(i => i.value);
  const form = document.querySelector('[data-form="create-project"]');
  if (form) {
    state.newProject = {
      name: form.elements.name.value,
      description: form.elements.description.value,
      deadline: form.elements.deadline.value,
    };
  }
}

// タスクのステータス変更 → 案件ステータスは computeProjectStatus で自動導出される
document.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-task-status]');
  if (!sel) return;
  const [pid, idx] = sel.dataset.taskStatus.split(':');
  const p = projectById(pid);
  if (p) { p.tasks[Number(idx)].status = sel.value; render(); }
});

// チャット送信
function sendMessage(pid) {
  const input = document.getElementById('chat-input');
  const p = projectById(pid);
  if (!input || !p) return;
  const value = input.value.trim();
  if (!value) return;
  const now = new Date();
  p.messages.push({
    self: true, name: CURRENT_USER.name, day: 0,
    time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
    text: value,
  });
  p.unread = 0;
  input.value = '';
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'chat-input') {
    e.preventDefault();
    const btn = document.querySelector('[data-act="send"]');
    if (btn) sendMessage(btn.dataset.project);
  }
});

// フォーム送信
document.addEventListener('submit', (e) => {
  const form = e.target;
  e.preventDefault();

  if (form.dataset.form === 'create-project') {
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    if (!name) return;
    const deadlineRaw = String(fd.get('deadline') || '').trim();
    const deadlineOffset = deadlineRaw ? deadlineDiffDays(new Date(deadlineRaw)) : 14;
    const titles = fd.getAll('tasks').map(v => String(v).trim()).filter(Boolean);

    PROJECTS.unshift({
      id: 'p-new-' + PROJECTS.length,
      name,
      // 非管理者の作成では client_id = 自分（＝依頼元は自分）
      client: CURRENT_USER.name,
      createdOffset: 0, updatedOffset: 0, deadlineOffset,
      description: String(fd.get('description') || ''),
      // 実装では作成時のタスクは '依頼済' で登録される（= 案件ステータスも '依頼済'）
      tasks: titles.map(title => ({ title, description: '', status: '依頼済', deadlineOffset, creator: CURRENT_USER.name })),
      files: [],
      messages: [],
      unread: 0,
    });

    state.modal = false;
    state.view = 'dashboard';
    state.filter = 'すべて';
    return render();
  }

  if (form.dataset.form === 'add-task') {
    const fd = new FormData(form);
    const title = String(fd.get('title') || '').trim();
    if (!title) return;
    const deadlineRaw = String(fd.get('deadline') || '').trim();
    const p = projectById(state.projectId);
    if (!p) return;
    p.tasks.push({
      title,
      description: String(fd.get('description') || ''),
      status: '依頼済',
      deadlineOffset: deadlineRaw ? deadlineDiffDays(new Date(deadlineRaw)) : null,
      creator: CURRENT_USER.name,
    });
    state.taskFormOpen = false;
    return render();
  }
});

render();
</script>
